# Career-Ops 个人资料配置（中文示例）
# 将本文件拷贝到 config/profile.yml 并填写你的信息。
# 这是所有模式中你个人数据的唯一信息源。

candidate:
  full_name: "张三"
  email: "zhangsan@example.com"
  phone: "+86-13800138000"
  location: "北京市朝阳区"
  linkedin: "linkedin.com/in/zhangsan"
  portfolio_url: "https://zhangsan.cn"
  github: "github.com/zhangsan"
  # 微信：如有公众号/视频号可在面试时提供

target_roles:
  # 你的北极星岗位——你优化的目标
  primary:
    - "高级AI产品经理"
    - "AI产品负责人"
  # Archetype帮助评估系统匹配度打分
  archetypes:
    - name: "AI产品经理"
      level: "高级/负责人"
      fit: "primary"        # primary = 理想岗位, secondary = 好匹配, adjacent = 可尝试
    - name: "AI运营"
      level: "高级"
      fit: "secondary"
    - name: "AI解决方案"
      level: "中高级"
      fit: "adjacent"

narrative:
  # 你的职业头衔（一句话）
  headline: "10年产品人转型AI产品，做过3款AI产品从0到1"
  # 你的职业故事——你的独特性
  exit_story: "在上一家公司从高级PM做到AI产品线负责人，主导了公司的AI转型。现在想在大模型时代做更有影响力的AI产品。"
  # 你的3-5个核心优势
  superpowers:
    - "AI产品方案设计（PRD到上线全流程）"
    - "用户需求挖掘与数据分析驱动决策"
    - "跨部门推动（技术+业务+设计）"
    - "大模型应用落地（RAG/Agent/Workflow）"
  # 证明点——有量化影响的项目、文章、案例
  proof_points:
    - name: "AI客服机器人"
      url: "https://zhangsan.cn/ai-cs-bot"
      hero_metric: "将客服效率提升60%，日均处理5000+对话"
    - name: "智能营销平台"
      url: "https://zhangsan.cn/ai-marketing"
      hero_metric: "为30+企业客户落地，年合同额500万+"
    - name: "AI产品方法论文章系列"
      url: "https://zhangsan.cn/articles"
      hero_metric: "全网阅读量10万+"
  # 可选：线上demo/dashboard的URL和密码
  demo_url: ""
  demo_password: ""
  # 在什么类型的岗位中分享demo链接
  demo_when: "AI产品经理、AI解决方案岗位"

compensation:
  # 薪资区间（人民币税前月薪，单位：k）
  target_range:
    min_k: 40
    max_k: 60
  currency: CNY
  # 最低接受（税前月薪，单位：k）
  minimum_k: 35
  # 薪资灵活性
  flexibility: "open"  # open = 可谈, firm = 不接受低于区间
  # 期望薪资结构
  structure_preference:
    - "税前月薪为主导"
    - "年终奖明确（至少2个月）"
    - "五险一金全额缴纳（实际工资基数）"
    - "公积金比例12%为佳"

location:
  country: CN
  city: "北京"
  timezone: "Asia/Shanghai"
  # 是否接受跨城市机会
  open_to_relocation: false
  # 期望工作城市（多项选择）
  preferred_cities:
    - "北京"
    - "上海"
    - "杭州"
  # 签证状态（国内通常不需要）
  visa_status: "n/a"

language:
  # 默认模式语言
  modes_dir: modes/zh

cv:
  # 简历输出格式: html
  output_format: html
